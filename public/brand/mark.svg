<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Viper Net">
  <title>Viper Net</title>
  <!-- A V for Viper, the beam of a lens narrowing, and the point it focuses to.
       Uses currentColor, so one file serves every colourway. -->
  <path d="M13 9 L32 46 L51 9" fill="none" stroke="currentColor" stroke-width="4.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="10" y="21.6" width="44" height="4.4" rx="2.2" fill="currentColor"/>
  <circle cx="32" cy="55" r="3.4" fill="currentColor"/>
</svg>
